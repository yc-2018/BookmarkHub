name: Release

# 打 v* 标签即自动构建并发布：
#   npm version patch   （会生成 v1.0.3 标签）
#   git push origin main --follow-tags
# 也可以在 Actions 页面手动触发，只产出构建产物、不创建 Release，用于验证流程。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          # --generate-notes 需要历史记录来和上一个标签做对比
          fetch-depth: 0

      # 必须在 setup-node 之前，否则 cache: pnpm 找不到 pnpm
      # 版本取自 package.json 的 packageManager 字段
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 读取版本号
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 校验标签与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg='${{ steps.meta.outputs.version }}'
          if [ "$tag" != "$pkg" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 package.json 的版本 ${pkg} 不一致，请先改版本号再打标签"
            exit 1
          fi
          echo "版本校验通过：${GITHUB_REF_NAME}"

      - name: 类型检查
        run: pnpm run compile

      - name: 打包 Chrome
        run: pnpm run zip

      - name: 打包 Firefox（含审核用源码包）
        run: pnpm run zip:firefox

      - name: 产物清单
        run: ls -lh .output/*.zip

      # 手动触发时没有 Release 可挂，产物留在这里供下载
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bookmarkhub-${{ steps.meta.outputs.version }}
          path: .output/*.zip
          if-no-files-found: error

      - name: 创建 Release 并附上产物
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 标签里带连字符的（如 v1.1.0-beta.1）标记为预发布
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac

          # 重跑同一个标签时不报错，直接覆盖已有产物
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，覆盖产物"
            gh release upload "$GITHUB_REF_NAME" .output/bookmarkhub-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              .output/bookmarkhub-*.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              $prerelease
          fi
